<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beware Of Dogs - Order & QRIS Payment</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <!-- html2pdf.js for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Midtrans Snap Script (Ganti client-key dengan milikmu dari dashboard Midtrans) -->
  <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-aQjD934a946uKXAa"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bodRed: '#ff2a2a',
            bodDarkRed: '#880000',
            bodBlack: '#080808',
            bodCard: '#121212',
            bodBorder: '#222222'
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #050505; color: #f3f4f6; font-family: 'Montserrat', sans-serif; }
    .gradient-glow { box-shadow: 0 0 30px rgba(255, 42, 42, 0.2); }
    .gradient-text { background: linear-gradient(135deg, #ffffff 0%, #ff2a2a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-bodRed selection:text-white">

  <div class="flex flex-col min-h-screen justify-between w-full">
    <!-- HEADER -->
    <header class="relative border-b border-bodBorder bg-black/90 backdrop-blur-md sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="cursor-pointer" onclick="window.location.href='../'">
            <img src="../WhatsApp Image 2026-10-17 at 16.14.10.jpeg.png" alt="Logo" class="h-12 w-auto object-contain rounded-md border border-bodBorder bg-black">
          </div>
          <div>
            <h1 class="text-lg font-black tracking-wider uppercase gradient-text">BEWARE OF DOGS</h1>
            <p class="text-[10px] text-gray-400 tracking-widest uppercase font-bold">QRIS AUTOMATIC PAYMENT</p>
          </div>
        </div>
        <a href="../" class="px-3 py-2 bg-bodCard border border-bodBorder text-gray-300 hover:text-white rounded-xl text-xs font-bold transition-all">
          <i class="fas fa-home text-bodRed mr-1"></i> Menu Utama
        </a>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow">
      <div class="bg-bodCard border border-bodBorder rounded-2xl p-6 sm:p-8 shadow-2xl relative">
        <div class="border-b border-bodBorder pb-4 mb-6">
          <h3 class="text-xl font-black text-white flex items-center gap-2 uppercase">
            <i class="fas fa-qrcode text-bodRed"></i> Form Order & Bayar QRIS
          </h3>
          <p class="text-xs text-gray-400 mt-1">Scan QRIS otomatis, data order langsung masuk ke database.</p>
        </div>

        <form id="formBaju" onsubmit="handlePaymentAndOrder(event)" class="space-y-5">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Nama Pemesan</label>
            <input type="text" id="bajuNama" required placeholder="Masukkan nama lengkap" class="w-full bg-black/90 border border-bodBorder focus:border-bodRed rounded-xl py-3 px-4 text-sm text-white outline-none">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Size Baju</label>
              <select id="bajuSize" required class="w-full bg-black/90 border border-bodBorder focus:border-bodRed rounded-xl py-3 px-4 text-sm text-white outline-none">
                <option value="" disabled selected>Pilih Ukuran</option>
                <option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Jumlah (Pcs)</label>
              <input type="number" id="bajuPcs" min="1" value="1" required oninput="calculateTotal()" class="w-full bg-black/90 border border-bodBorder focus:border-bodRed rounded-xl py-3 px-4 text-sm text-white outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Nomor WhatsApp</label>
            <input type="tel" id="bajuWa" required placeholder="Contoh: 081234567890" class="w-full bg-black/90 border border-bodBorder focus:border-bodRed rounded-xl py-3 px-4 text-sm text-white outline-none">
          </div>

          <div class="bg-black/60 border border-bodBorder rounded-xl p-4 flex justify-between items-center">
            <span class="text-xs text-gray-400 font-bold uppercase">Total Pembayaran:</span>
            <span id="totalDisplay" class="text-xl font-black text-bodRed">Rp 180.000</span>
          </div>

          <button type="submit" id="btnPay" class="w-full bg-gradient-to-r from-bodRed to-bodDarkRed hover:from-red-600 text-white font-extrabold py-4 rounded-xl shadow-lg transition-all uppercase text-xs tracking-wider cursor-pointer">
            <i class="fas fa-qrcode mr-2"></i> Bayar dengan QRIS / E-Wallet
          </button>
        </form>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-bodBorder bg-black py-4 text-center text-gray-500 text-xs">
      &copy; 2026 Beware Of Dogs Official. All rights reserved.
    </footer>
  </div>

  <!-- FIREBASE & MIDTRANS LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPhTTD5cAjvojNu4pAEXOGEoIkipyPo5k",
      authDomain: "bewareofdogs-af4a5.firebaseapp.com",
      databaseURL: "https://bewareofdogs-af4a5-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bewareofdogs-af4a5",
      storageBucket: "bewareofdogs-af4a5.appspot.com",
      messagingSenderId: "1087595396696",
      appId: "1:1087595396696:web:f93af34a1842a1fbd6d42d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const hargaSatuan = 180000;

    window.calculateTotal = function() {
      const pcs = parseInt(document.getElementById('bajuPcs').value) || 1;
      document.getElementById('totalDisplay').innerText = 'Rp ' + (pcs * hargaSatuan).toLocaleString('id-ID');
    }

    window.handlePaymentAndOrder = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnPay');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Menghubungkan ke Payment Gateway...`;

      const nama = document.getElementById('bajuNama').value.trim();
      const size = document.getElementById('bajuSize').value;
      const pcs = parseInt(document.getElementById('bajuPcs').value) || 1;
      let wa = document.getElementById('bajuWa').value.trim();
      const totalHarga = pcs * hargaSatuan;
      const orderId = 'BOD-QRS-' + Date.now().toString().slice(-6);

      // Data order yang akan disimpan setelah bayar sukses
      const orderData = {
        orderId,
        tipe: 'Baju (QRIS)',
        nama,
        size,
        pcs,
        hargaSatuan,
        totalHarga,
        whatsapp: wa.startsWith('0') ? '62' + wa.slice(1) : wa,
        dateFormatted: new Date().toLocaleString('id-ID'),
        status: 'LUNAS'
      };

      try {
        // 1. Minta Snap Token dari Backend / Firebase Cloud Function kamu
        // (Ganti URL di bawah dengan endpoint Cloud Function / serverless kamu)
const response = await fetch('https://bod-qris-api.vercel.app/api/qris', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ orderId, totalHarga, nama, wa })
});
        
        const data = await response.json();
        const snapToken = data.token;

        // 2. Buka Popup Midtrans Snap (Pilih QRIS / GoPay / dll)
        window.snap.pay(snapToken, {
          onSuccess: async function(result) {
            // Jika pembayaran sukses, simpan otomatis ke Firebase Realtime Database
            await set(ref(db, 'baju_orders/' + orderId), orderData);
            alert("Pembayaran QRIS Berhasil & Order Tercatat di Database!");
            window.location.href = '../'; // Kembali ke menu utama
          },
          onPending: function(result) {
            alert("Menunggu pembayaran QRIS diselesaikan.");
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-qrcode mr-2"></i> Bayar dengan QRIS / E-Wallet`;
          },
          onError: function(result) {
            alert("Pembayaran gagal / dibatalkan.");
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-qrcode mr-2"></i> Bayar dengan QRIS / E-Wallet`;
          }
        });

      } catch (err) {
        console.error(err);
        alert("Gagal memproses pembayaran. Periksa koneksi atau konfigurasi backend.");
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-qrcode mr-2"></i> Bayar dengan QRIS / E-Wallet`;
      }
    }
  </script>
</body>
</html>
